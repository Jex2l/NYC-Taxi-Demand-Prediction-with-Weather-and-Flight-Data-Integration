<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}NYC Taxi Demand Predictor{% endblock %}</title>
    <meta name="description" content="Forecast hourly NYC taxi pickup demand from time, weather, and flight-arrival signals.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="shell">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">🚕</span>
                <span class="brand-text">
                    <span class="brand-title">NYC Taxi Demand</span>
                    <span class="brand-subtitle">Prediction Service</span>
                </span>
            </a>
            <span class="brand-tag">Weather + Flight‑aware forecasting</span>
        </div>
    </header>

    <main class="shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="shell">
            <p>NYC Taxi Demand Prediction with Weather and Flight Data Integration &mdash; MLOps pipeline on Chameleon Cloud.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" type="text/javascript"></script>
</body>

</html>
